name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and Plugin Hub checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Make sure gradle-wrapper.jar is an official Gradle release
      - uses: gradle/actions/wrapper-validation@v4

      # The Plugin Hub builds and runs plugins on Java 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

      # wasted-bank-space is this plugin's file name in runelite/plugin-hub/plugins
      - name: Plugin Hub checks
        run: python3 .github/scripts/plugin_hub_checks.py --internal-name wasted-bank-space build/libs/*.jar
